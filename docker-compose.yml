services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-comic}
      POSTGRES_DB: comic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comic"]
      interval: 5s
      retries: 10
    # Only exposed to localhost (handy for local dev / backups). Never public.
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://comic:${DB_PASSWORD:-comic}@db:5432/comic
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    profiles: ["app"]

volumes:
  pgdata:
  uploads:
